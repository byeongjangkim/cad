축 연결 어댑터 상세 미완</text><text x="720" y="535" font-size="19" fill="#17253a">전륜 조향</text><text x="720" y="562" font-size="17" fill="#17253a">Traxxas 2280 / 8946 후보</text><text x="720" y="586" font-size="15" fill="#805b30">타이로드 길이·범프스티어 미검증</text><text x="720" y="665" font-size="22" fill="#17253a">설계 조건 / 해석 범위</text><text x="720" y="702" font-size="17" fill="#17253a">적재10kg ≠ 총중량10kg</text><text x="720" y="731" font-size="17" fill="#17253a">질량 예산: 기체·배터리11.66 + 적재10kg</text><text x="720" y="760" font-size="17" fill="#17253a">속도 목표 0.1–2m/s → Ø160에서12–239rpm</text><text x="720" y="789" font-size="17" fill="#17253a">타이어·배터리·스프링·드라이버 미선정</text><text x="720" y="818" font-size="17" fill="#17253a">외형520×440은 직진 상태의 잠정치</text><text x="720" y="847" font-size="17" fill="#17253a">조향·현가 운동 때 필요한 공간은 별도</text><text x="720" y="876" font-size="17" fill="#b45309">이 도면으로 구매·절삭 가공하지 않음</text></g></svg>