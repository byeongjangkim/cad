<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="white"/><g font-family="Arial, sans-serif" fill="#172536"><text x="35" y="48" font-size="27">B형 R2 · 허브 동력 전달 / 부품 연결 설명도</text><text x="35" y="80" font-size="17">축척 없음 · 축방향 간격 미확인 · 가공용 단면도 아님</text><rect x="35" y="240" width="150" height="100" fill="#e6edf3" stroke="#255474" stroke-width="2"/><text x="110.0" y="222" text-anchor="middle" font-size="16">CV / 도그본</text><text x="110.0" y="366" text-anchor="middle" font-size="14">142 / 139 표기</text><rect x="225" y="250" width="160" height="80" fill="#e6edf3" stroke="#255474" stroke-width="2"/><text x="305.0" y="232" text-anchor="middle" font-size="16">액슬</text><text x="305.0" y="356" text-anchor="middle" font-size="14">AR310590 / 591</text><rect x="430" y="200" width="80" height="180" fill="#e6edf3" stroke="#255474" stroke-width="2"/><text x="470.0" y="182" text-anchor="middle" font-size="16">내측 베어링</text><text x="470.0" y="406" text-anchor="middle" font-size="14">15×21×4</text><rect x="565" y="220" width="80" height="140" fill="#e6edf3" stroke="#255474" stroke-width="2"/><text x="605.0" y="202" text-anchor="middle" font-size="16">외측 베어링</text><text x="605.0" y="386" text-anchor="middle" font-size="14">8×16×5</text><rect x="705" y="240" width="115" height="100" fill="#e6edf3" stroke="#255474" stroke-width="2"/><text x="762.5" y="222" text-anchor="middle" font-size="16">구동핀</text><text x="762.5" y="366" text-anchor="middle" font-size="14">AR713009</text><rect x="875" y="220" width="120" height="140" fill="#e6edf3" stroke="#255474" stroke-width="2"/><text x="935.0" y="202" text-anchor="middle" font-size="16">17mm 헥스</text><text x="935.0" y="386" text-anchor="middle" font-size="14">전/후 품번 구분</text><rect x="1050" y="160" width="110" height="260" fill="#e6edf3" stroke="#255474" stroke-width="2"/><text x="1105.0" y="142" text-anchor="middle" font-size="16">휠</text><text x="1105.0" y="446" text-anchor="middle" font-size="14">ARA550059</text><path d="M185 290 H225 M385 290 H430 M510 290 H565 M645 290 H705 M820 290 H875 M995 290 H1050" stroke="#ed8426" stroke-width="5"/><text x="35" y="505" font-size="19">회전 동력: 구동축 → 액슬 → 핀 → 헥스 → 휠</text><text x="35" y="540" font-size="19">베어링: 회전축 지지. 외륜은 허브에, 내륜은 액슬에 결합합니다.</text><text x="35" y="575" font-size="19">전륜 헥스 AR310484 (17 / 16.5) · 후륜 AR310447 (17 / 13.6)</text><text x="35" y="610" font-size="19">필수 실측: 베어링 중심간격, 축 단차길이, 핀 위치, 휠 장착면 오프셋</text><text x="35" y="655" font-size="19">출처: ARRMA ARA10604 설명서 p.46 / p.58 및 BUYRC 품목 규격</text></g></svg>